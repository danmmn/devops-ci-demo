name: CI Build Multi Image GitOps
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 删掉 persist-credentials: false
      - name: Setup buildx
        uses: docker/setup-buildx-action@v3
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 构建前端镜像，使用commit sha作为tag
      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: xhyyy0212/cidemo-frontend:${{ github.sha }}
      # 构建后端api镜像
      - name: Build & Push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: xhyyy0212/cidemo-api:${{ github.sha }}
      # 自动更新yaml内image标签为本次commit sha
      - name: Update image tag
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: |
            yq '.spec.template.spec.containers[0].image = "xhyyy0212/cidemo-frontend:${{ github.sha }}"' apps/frontend/deployment.yaml;
            yq '.spec.template.spec.containers[0].image = "xhyyy0212/cidemo-api:${{ github.sha }}"' apps/api/deployment.yaml
      - name: Commit manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/danmmn/devops-ci-demo.git
          git add apps/frontend/deployment.yaml apps/api/deployment.yaml
          # 检测是否存在修改，有修改才提交推送
          CHANGES=$(git diff --cached --quiet; echo $?)
          if [ $CHANGES -ne 0 ];then
            git commit -m "chore: auto update image tag to ${{ github.sha }} [skip ci]"
            git push
          fi
